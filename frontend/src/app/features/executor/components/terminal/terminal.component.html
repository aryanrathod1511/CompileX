<div 
  class="flex flex-col h-full w-full transition-all duration-300 bg-bg-main text-text-main"
>

  <!-- Panel Header (Programiz Style) -->
  <header 
    class="flex items-center justify-between h-12 border-b flex-shrink-0 select-none px-4 bg-bg-panel-header border-border-main"
  >
    <div class="flex items-center gap-3">
      <h2 
        class="text-xs font-bold uppercase tracking-wider select-none font-sans text-text-main"
      >
        Output
      </h2>
    </div>
    
    <!-- Clear button -->
    <button 
      class="flex items-center gap-1.5 text-xs font-semibold px-4.5 py-1.5 rounded transition-all duration-150 border cursor-pointer select-none bg-bg-main border-border-button text-text-muted hover:bg-bg-button-hover hover:text-text-main shadow-sm"
      (click)="onClearOutput()" 
      id="clear-output-btn" 
      title="Clear output console"
    >
      Clear
    </button>
  </header>

  <!-- Output Area -->
  <div 
    class="flex-1 min-h-0 relative p-4 cursor-text transition-all duration-300"
    (click)="focusTerminal()"
  >
    <div
      #terminalContainer
      class="w-full h-full overflow-hidden"
      id="terminal-output"
    ></div>
  </div>

  <!-- Terminal Instructions Footer (Capturing keystrokes prompt) -->
  <div 
    class="px-5 py-2.5 border-t text-[10px] flex items-center gap-2 select-none font-sans bg-bg-panel-header border-border-main text-text-muted" 
    *ngIf="isInputEnabled"
  >
    <span class="text-xs animate-bounce">⌨️</span> Click inside the terminal and type inputs directly.
  </div>

</div>
